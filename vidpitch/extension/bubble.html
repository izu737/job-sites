<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #292a2e; }
  [hidden] { display: none !important; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
  body.unflipped video { transform: none; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 18%; text-align: center; color: #b7b9be;
    font: 500 12px/1.35 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div class="msg" id="msg" hidden>Camera unavailable</div>
<script src="bubble.js"></script>
</body>
</html>
